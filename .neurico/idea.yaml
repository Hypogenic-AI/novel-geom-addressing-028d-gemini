idea:
  title: Are repeated novel geometries addressable witout reasoning?
  domain: artificial_intelligence
  hypothesis: 'It is unknown whether models that learn 2D geometries in context can
    be verbally addressed through prompting, especially when there is limited repetition.
    This research will test if repeated novel geometries are addressable without explicit
    reasoning.

    '
  background:
    description: 'Models learn 2D geometries in context:

      https://arxiv.org/abs/2501.00070

      Are these geometries verbally addressable through prompting? What if there isn''t
      that much repetition?

      '
    papers:
    - description: https://arxiv.org/abs/2501.00070
