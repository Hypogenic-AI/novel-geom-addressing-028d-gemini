[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for experiments"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.105.2",
    "arxiv>=4.0.0",
    "datasets>=4.8.5",
    "httpx>=0.28.1",
    "huggingface-hub>=1.17.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "openai>=2.38.0",
    "pandas>=2.3.3",
    "pillow>=12.2.0",
    "pypdf>=6.12.2",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "scipy>=1.15.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
